<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <rect width="400" height="400" fill="#EFF2F5"/>
  <!-- Sofa base -->
  <rect x="60" y="230" width="280" height="90" rx="14" fill="#B8C4D0"/>
  <!-- Sofa back -->
  <rect x="70" y="165" width="260" height="75" rx="12" fill="#C8D2DC"/>
  <!-- Left arm -->
  <rect x="55" y="188" width="38" height="100" rx="10" fill="#AFC0CE"/>
  <!-- Right arm -->
  <rect x="307" y="188" width="38" height="100" rx="10" fill="#AFC0CE"/>
  <!-- Left cushion -->
  <rect x="80" y="235" width="115" height="70" rx="8" fill="#D0DCE6"/>
  <!-- Right cushion -->
  <rect x="205" y="235" width="115" height="70" rx="8" fill="#D0DCE6"/>
  <!-- Seat line divider -->
  <line x1="197" y1="235" x2="197" y2="305" stroke="#AFC0CE" stroke-width="2"/>
  <!-- Legs -->
  <rect x="90" y="318" width="16" height="28" rx="4" fill="#9AAABA"/>
  <rect x="294" y="318" width="16" height="28" rx="4" fill="#9AAABA"/>
  <text x="200" y="370" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#8A9BAA" letter-spacing="3">FURNITURE</text>
</svg>
