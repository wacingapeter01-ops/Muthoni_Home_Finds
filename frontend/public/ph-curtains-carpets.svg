<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <rect width="400" height="400" fill="#F0EDE8"/>
  <!-- Curtain rod -->
  <rect x="60" y="95" width="280" height="10" rx="5" fill="#C4B8A8"/>
  <!-- Ring dots on rod -->
  <circle cx="100" cy="100" r="6" fill="#B0A08A"/>
  <circle cx="150" cy="100" r="6" fill="#B0A08A"/>
  <circle cx="200" cy="100" r="6" fill="#B0A08A"/>
  <circle cx="250" cy="100" r="6" fill="#B0A08A"/>
  <circle cx="300" cy="100" r="6" fill="#B0A08A"/>
  <!-- Left curtain panel -->
  <path d="M70 100 Q90 160 80 220 Q90 270 75 320" stroke="none" fill="#CFC0AE"/>
  <rect x="70" y="100" width="110" height="220" rx="4" fill="#CFC0AE" opacity="0.9"/>
  <!-- Left curtain folds -->
  <path d="M95 100 Q100 180 95 260" stroke="#B8A898" stroke-width="2" stroke-dasharray="4,6"/>
  <path d="M120 100 Q125 180 120 260" stroke="#B8A898" stroke-width="2" stroke-dasharray="4,6"/>
  <path d="M150 100 Q155 180 150 260" stroke="#B8A898" stroke-width="2" stroke-dasharray="4,6"/>
  <!-- Right curtain panel -->
  <rect x="220" y="100" width="110" height="220" rx="4" fill="#CFC0AE" opacity="0.9"/>
  <!-- Right curtain folds -->
  <path d="M245 100 Q250 180 245 260" stroke="#B8A898" stroke-width="2" stroke-dasharray="4,6"/>
  <path d="M270 100 Q275 180 270 260" stroke="#B8A898" stroke-width="2" stroke-dasharray="4,6"/>
  <path d="M300 100 Q305 180 300 260" stroke="#B8A898" stroke-width="2" stroke-dasharray="4,6"/>
  <!-- Carpet on floor -->
  <rect x="80" y="330" width="240" height="40" rx="6" fill="#C4A882"/>
  <rect x="95" y="337" width="210" height="26" rx="4" fill="#D4BC9A"/>
  <!-- Carpet pattern lines -->
  <line x1="130" y1="337" x2="130" y2="363" stroke="#C4A882" stroke-width="1.5"/>
  <line x1="200" y1="337" x2="200" y2="363" stroke="#C4A882" stroke-width="1.5"/>
  <line x1="270" y1="337" x2="270" y2="363" stroke="#C4A882" stroke-width="1.5"/>
  <text x="200" y="395" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#A09080" letter-spacing="2">CURTAINS &amp; CARPETS</text>
</svg>
